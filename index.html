<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#ffd1ff);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
text-align:center;
color:white;
padding:20px;
z-index:5;
}

h1{
font-size:3rem;
text-shadow:0 0 20px white;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{transform:scale(1);}
to{
transform:scale(1.05);
text-shadow:0 0 30px #fff,
0 0 60px pink;
}
}

p{
margin-top:20px;
font-size:1.2rem;
line-height:1.7;
max-width:700px;
}

button{
margin-top:30px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
background:white;
color:#ff4081;
cursor:pointer;
transition:.3s;
font-weight:bold;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

button:hover{
transform:scale(1.1);
background:#ff4081;
color:white;
}

.cake{
font-size:80px;
margin:25px 0;
animation:bounce 1s infinite alternate;
}

@keyframes bounce{
from{transform:translateY(0);}
to{transform:translateY(-15px);}
}

/* Hearts */

.heart{
position:absolute;
bottom:-50px;
font-size:22px;
animation:floatHeart linear infinite;
opacity:.8;
}

@keyframes floatHeart{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(-110vh) rotate(360deg);
opacity:0;
}
}

/* Confetti */

.confetti{
position:absolute;
width:10px;
height:18px;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(720deg);
}
}

/* Responsive */

@media(max-width:768px){

h1{
font-size:2.2rem;
}

p{
font-size:16px;
}

.cake{
font-size:60px;
}

button{
font-size:16px;
padding:13px 28px;
}

}
</style>
</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday! 🎉</h1>

<div class="cake">🎂</div>

<p>
Wishing you a day filled with happiness, endless smiles,
beautiful memories, and all the love you deserve.
May every dream you have come true and may this year
bring countless reasons to smile.
<br><br>
✨ Stay amazing. Stay blessed. Stay happy. ❤️
</p>

<button onclick="burstConfetti()">
🎁 Celebrate
</button>

</div>

<script>

// Floating Hearts

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*4)+"s";

heart.style.fontSize=(15+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,400);


// Confetti

const colors=[
"#ff0",
"#ff4081",
"#00e5ff",
"#00ff6a",
"#ff5722",
"#ffffff",
"#7c4dff"
];

function createConfetti(){

const conf=document.createElement("div");

conf.className="confetti";

conf.style.left=Math.random()*100+"vw";

conf.style.background=
colors[Math.floor(Math.random()*colors.length)];

conf.style.width=(6+Math.random()*8)+"px";

conf.style.height=(10+Math.random()*14)+"px";

conf.style.animationDuration=(3+Math.random()*4)+"s";

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},7000);

}

function burstConfetti(){

for(let i=0;i<250;i++){

setTimeout(()=>{
createConfetti();
},i*8);

}

}

// Auto confetti

burstConfetti();

setInterval(burstConfetti,7000);

</script>

</body>
</html>
